basePath: /api
definitions:
  internal_handlers.AccessCodeResponse:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  internal_handlers.AdminStats:
    properties:
      active_accounts:
        type: integer
      payment_tiers:
        items:
          $ref: '#/definitions/internal_handlers.PaymentTier'
        type: array
      pets_per_clinic:
        items:
          $ref: '#/definitions/internal_handlers.ClinicPetCount'
        type: array
      total_cats:
        type: integer
      total_dogs:
        type: integer
      total_other:
        type: integer
      total_owners:
        type: integer
      total_pets:
        type: integer
      total_vets:
        type: integer
    required:
    - active_accounts
    - payment_tiers
    - pets_per_clinic
    - total_cats
    - total_dogs
    - total_other
    - total_owners
    - total_pets
    - total_vets
    type: object
  internal_handlers.AllergyResponse:
    properties:
      comment:
        type: string
      date:
        type: string
      id:
        type: integer
      mine:
        description: Mine is true when the caller's clinic recorded it (and may delete
          it).
        type: boolean
      name:
        type: string
      uuid:
        type: string
    required:
    - comment
    - date
    - id
    - mine
    - name
    - uuid
    type: object
  internal_handlers.AppleVerifyRequest:
    properties:
      package_id:
        type: integer
      pet_id:
        type: integer
      signed_transaction:
        description: StoreKit 2 JWS signed transaction
        type: string
    required:
    - package_id
    - pet_id
    - signed_transaction
    type: object
  internal_handlers.BreedCount:
    properties:
      breed:
        type: string
      count:
        type: integer
    required:
    - breed
    - count
    type: object
  internal_handlers.CalendarItem:
    properties:
      date:
        type: string
      name:
        type: string
      petId:
        type: string
      petName:
        type: string
      type:
        type: string
    required:
    - date
    - name
    - petId
    - petName
    - type
    type: object
  internal_handlers.CertificateOwner:
    properties:
      address:
        type: string
      name:
        type: string
      personal_id:
        type: string
      phone:
        type: string
    required:
    - address
    - name
    - personal_id
    - phone
    type: object
  internal_handlers.CertificateResponse:
    properties:
      complex:
        $ref: '#/definitions/vetapp-backend_internal_models.Procedure'
      dehelminization:
        $ref: '#/definitions/vetapp-backend_internal_models.Procedure'
      ectoparasite:
        $ref: '#/definitions/vetapp-backend_internal_models.Procedure'
      owner:
        $ref: '#/definitions/internal_handlers.CertificateOwner'
      pet:
        $ref: '#/definitions/vetapp-backend_internal_models.Pet'
      rabies:
        $ref: '#/definitions/vetapp-backend_internal_models.Procedure'
    required:
    - owner
    - pet
    type: object
  internal_handlers.ChangePasswordRequest:
    properties:
      current_password:
        minLength: 1
        type: string
      new_password:
        description: 8 chars matches the registration / reset minimum used elsewhere.
        maxLength: 50
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_handlers.ChangePasswordResponse:
    properties:
      ok:
        type: boolean
    required:
    - ok
    type: object
  internal_handlers.CheckoutRequest:
    properties:
      package_id:
        type: integer
      pet_id:
        type: integer
    required:
    - package_id
    - pet_id
    type: object
  internal_handlers.CheckoutResponse:
    properties:
      order_id:
        type: string
      provider:
        description: |-
          Provider tells the client which gateway served this checkout
          ("bog" or "ipay"). Clients shouldn't branch on it for the happy
          path — both are a WebView redirect — but it makes support
          tickets and client-side logs far easier to trace back.
        type: string
      redirect_url:
        type: string
    required:
    - order_id
    - redirect_url
    type: object
  internal_handlers.ClinicPetCount:
    properties:
      clinic:
        type: string
      company_name:
        type: string
      count:
        type: integer
    required:
    - clinic
    - count
    type: object
  internal_handlers.ClinicStats:
    properties:
      monthlyTrends:
        items:
          $ref: '#/definitions/internal_handlers.MonthlyTrendItem'
        type: array
      sexDistribution:
        items:
          $ref: '#/definitions/internal_handlers.SexCount'
        type: array
      speciesBreakdown:
        items:
          $ref: '#/definitions/internal_handlers.SpeciesCount'
        type: array
      topBreeds:
        items:
          $ref: '#/definitions/internal_handlers.BreedCount'
        type: array
      topProcedures:
        items:
          $ref: '#/definitions/internal_handlers.ProcedureCount'
        type: array
      topVaccines:
        items:
          $ref: '#/definitions/internal_handlers.VaccineCount'
        type: array
      totalOwners:
        type: integer
      totalPets:
        type: integer
      totalRecords:
        type: integer
    required:
    - monthlyTrends
    - sexDistribution
    - speciesBreakdown
    - topBreeds
    - topProcedures
    - topVaccines
    - totalOwners
    - totalPets
    - totalRecords
    type: object
  internal_handlers.CreateAllergyRequest:
    properties:
      comment:
        description: Free-text note
        type: string
      date:
        description: Date recorded; defaults to today
        type: string
      name:
        description: Allergy name
        type: string
      uuid:
        description: Pet ID
        type: string
    required:
    - name
    - uuid
    type: object
  internal_handlers.CreateHomeProcedureRequest:
    properties:
      days:
        maximum: 27
        minimum: 1
        type: integer
      name:
        type: string
      start_date:
        description: defaults to today
        type: string
    required:
    - days
    - name
    type: object
  internal_handlers.CreatePetRequest:
    properties:
      address:
        type: string
      chip:
        type: string
      code:
        type: string
      color:
        type: string
      date:
        type: string
      email:
        type: string
      first_name:
        type: string
      name:
        type: string
      pet:
        type: string
      phone:
        type: string
      sex:
        type: string
      status:
        type: integer
      uuid:
        type: string
      variety:
        type: string
    required:
    - name
    - uuid
    type: object
  internal_handlers.CreatePriceRequest:
    properties:
      name:
        type: string
      price:
        type: string
    required:
    - name
    - price
    type: object
  internal_handlers.CreateProcedureRequest:
    properties:
      address:
        description: |-
          Address and Sax are test-result columns on the dog test (Giardia and
          Erlichia canis, see procedure_forms.go). On every other tp they hold
          the owner address / pet sex and are filled from the pet instead.
        type: string
      anam:
        type: string
      chip:
        description: |-
          Chip is the microchip number for tp=115. It is written to the pet
          record as well as the procedure (PHP stores it in `coment` too).
        type: string
      coment:
        type: string
      dani:
        type: string
      date:
        type: string
      date2:
        type: string
      date3:
        type: string
      deh:
        type: string
      diagn:
        type: string
      koment:
        type: string
      nout:
        type: string
      owner:
        type: string
      ownern:
        type: string
      phone:
        type: string
      pname:
        type: string
      price:
        type: string
      sax:
        type: string
      ser:
        type: string
      test1:
        type: string
      test2:
        type: string
      test3:
        type: string
      test4:
        type: string
      test5:
        type: string
      test6:
        type: string
      test7:
        type: string
      test8:
        type: string
      tp:
        minimum: 1
        type: integer
      tpname:
        type: string
      uuid:
        type: string
      vac:
        type: string
      vac1:
        type: string
      vac2:
        type: string
      vac3:
        type: string
      vac4:
        type: string
      vac5:
        type: string
      vac6:
        type: string
      vac7:
        type: string
      vac8:
        type: string
      vac9:
        type: string
      vacn:
        type: string
      vetname:
        description: |-
          VetName is the member id of the vet who performed the procedure,
          chosen from the clinic's staff (PHP's "ვეტერინარი" dropdown).
          Defaults to the caller. Must be a vet at the caller's clinic.
        type: string
    required:
    - tp
    - uuid
    type: object
  internal_handlers.CreateShopRequest:
    properties:
      comment:
        type: string
      date:
        type: string
      method:
        enum:
        - card
        - cash
        type: string
      name:
        type: string
      price:
        type: string
    required:
    - date
    - name
    - price
    type: object
  internal_handlers.DailyClinicStats:
    properties:
      card:
        type: string
      cash:
        type: string
      date:
        type: string
      procedures:
        items:
          $ref: '#/definitions/internal_handlers.ProcedureTypeRevenue'
        type: array
      total:
        type: string
    type: object
  internal_handlers.DailySummary:
    properties:
      card:
        type: string
      cash:
        type: string
      date:
        type: string
      total:
        type: string
    required:
    - card
    - cash
    - date
    - total
    type: object
  internal_handlers.DailyTotal:
    properties:
      count:
        type: integer
      date:
        type: string
      total:
        type: string
    type: object
  internal_handlers.EctoOptionsResponse:
    properties:
      collars:
        items:
          $ref: '#/definitions/internal_handlers.SelectOption'
        type: array
      drops:
        items:
          $ref: '#/definitions/internal_handlers.SelectOption'
        type: array
      sprays:
        items:
          $ref: '#/definitions/internal_handlers.SelectOption'
        type: array
      tablets:
        items:
          $ref: '#/definitions/internal_handlers.SelectOption'
        type: array
    required:
    - collars
    - drops
    - sprays
    - tablets
    type: object
  internal_handlers.EmailVerifySendResponse:
    properties:
      detail:
        description: human-readable note
        type: string
      status:
        description: '"sent" | "pending"'
        type: string
    required:
    - status
    type: object
  internal_handlers.ErrorResponse:
    properties:
      error:
        type: string
    required:
    - error
    type: object
  internal_handlers.FormField:
    properties:
      column:
        type: string
      depends_on:
        type: string
      group:
        description: panel heading for grouped test results
        type: string
      kind:
        description: 'Kind: text | textarea | select | result (positive/negative)
          | date | money'
        type: string
      label:
        type: string
      options:
        description: |-
          Options for a select. With DependsOn set, OptionsBy holds one list
          per value of that field (vaccine brand by vaccine type).
        items:
          type: string
        type: array
      options_by:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      required:
        type: boolean
    required:
    - column
    - kind
    - label
    type: object
  internal_handlers.HomeProcedureItem:
    properties:
      active:
        type: boolean
      days:
        type: integer
      done:
        description: '"YYYY-MM-DD HH:MM", newest first'
        items:
          type: string
        type: array
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
      start_date:
        type: string
    required:
    - active
    - days
    - done
    - end_date
    - id
    - name
    - start_date
    type: object
  internal_handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers.LoginResponse:
    properties:
      access_token:
        type: string
      refreshToken:
        description: camelCase — frontend expects this
        type: string
    required:
    - access_token
    - refreshToken
    type: object
  internal_handlers.MedicalRecord:
    properties:
      anamnesis:
        type: string
      comment:
        type: string
      date:
        type: string
      diagnosis:
        type: string
      id:
        type: string
      notes:
        type: string
      price:
        type: string
      procedureName:
        type: string
      procedureType:
        type: string
      tests:
        items:
          type: string
        type: array
      vaccinations:
        items:
          type: string
        type: array
      vetName:
        type: string
    required:
    - anamnesis
    - comment
    - diagnosis
    - id
    - notes
    - price
    - procedureName
    - procedureType
    - tests
    - vaccinations
    - vetName
    type: object
  internal_handlers.MessageResponse:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  internal_handlers.MonthlyClinicStats:
    properties:
      dailyBreakdown:
        items:
          $ref: '#/definitions/internal_handlers.DailyTotal'
        type: array
      month:
        type: string
      procedures:
        items:
          $ref: '#/definitions/internal_handlers.ProcedureTypeRevenue'
        type: array
      total:
        type: string
    type: object
  internal_handlers.MonthlyTotal:
    properties:
      count:
        type: integer
      month:
        type: string
      total:
        type: string
    type: object
  internal_handlers.MonthlyTrendItem:
    properties:
      month:
        type: string
      records:
        type: integer
    required:
    - month
    - records
    type: object
  internal_handlers.OTPSendRequest:
    properties:
      phone:
        type: string
      type:
        enum:
        - register
        - recovery
        type: string
    required:
    - phone
    - type
    type: object
  internal_handlers.OTPSendResponse:
    properties:
      otp_id:
        type: integer
    required:
    - otp_id
    type: object
  internal_handlers.OTPVerifyRequest:
    properties:
      code:
        type: string
      otp_id:
        type: integer
    required:
    - code
    - otp_id
    type: object
  internal_handlers.OTPVerifyResponse:
    properties:
      verified:
        type: boolean
    required:
    - verified
    type: object
  internal_handlers.OwnerCreatePetRequest:
    properties:
      chip:
        type: string
      color:
        type: string
      date:
        type: string
      name:
        type: string
      pet:
        type: string
      petStatus:
        description: INHABITANT | ADOPTED | WORKMATE
        type: string
      sex:
        type: string
      variety:
        type: string
    required:
    - name
    type: object
  internal_handlers.OwnerCreateProcedureRequest:
    properties:
      anam:
        type: string
      coment:
        type: string
      dani:
        type: string
      date:
        type: string
      date2:
        type: string
      date3:
        type: string
      deh:
        type: string
      diagn:
        type: string
      nout:
        type: string
      ser:
        type: string
      tp:
        minimum: 1
        type: integer
      tpname:
        type: string
      vac:
        type: string
      vac1:
        type: string
      vac2:
        type: string
      vac3:
        type: string
      vac4:
        type: string
      vac5:
        type: string
      vac6:
        type: string
      vac7:
        type: string
      vac8:
        type: string
      vac9:
        type: string
      vacn:
        type: string
    required:
    - tp
    type: object
  internal_handlers.OwnerDiseaseItem:
    properties:
      date:
        type: string
      id:
        type: string
      name:
        type: string
    required:
    - id
    - name
    type: object
  internal_handlers.OwnerEctoItem:
    properties:
      name:
        description: brand / preparat name
        type: string
      type:
        description: '"drops" | "pills" | "collar" | "spray"'
        type: string
    required:
    - name
    - type
    type: object
  internal_handlers.OwnerPetDetail:
    properties:
      birth:
        type: string
      breed:
        type: string
      castrated:
        type: boolean
      categories:
        items:
          $ref: '#/definitions/internal_handlers.ProcedureCategoryCount'
        type: array
      chip:
        type: string
      code:
        type: string
      color:
        type: string
      id:
        type: string
      name:
        type: string
      petStatus:
        description: '"INHABITANT", "ADOPTED", "WORKMATE"'
        type: string
      sex:
        type: string
      species:
        type: string
      subscriptionExpiry:
        type: string
      subscriptionStatus:
        description: '"active", "expired", "unregistered"'
        type: string
      uuid:
        type: string
      vet:
        type: string
    required:
    - breed
    - castrated
    - chip
    - code
    - color
    - id
    - name
    - sex
    - species
    - subscriptionStatus
    - uuid
    - vet
    type: object
  internal_handlers.OwnerPetItem:
    properties:
      birth:
        type: string
      breed:
        type: string
      chip:
        type: string
      color:
        type: string
      id:
        type: string
      name:
        type: string
      petStatus:
        description: '"INHABITANT", "ADOPTED", "WORKMATE"'
        type: string
      sex:
        type: string
      species:
        type: string
      subscriptionExpiry:
        type: string
      subscriptionStatus:
        description: '"active", "expired", "unregistered"'
        type: string
    required:
    - breed
    - chip
    - color
    - id
    - name
    - sex
    - species
    - subscriptionStatus
    type: object
  internal_handlers.OwnerProcedureItem:
    properties:
      addedByOwner:
        description: true => self-reported, deletable
        type: boolean
      anamnesis:
        description: tp=10x/20x — anamnesis. tp=1/2 — also surfaced if set.
        type: string
      clinicName:
        description: resolved clinic name via `sk` -> memberlogin_members.company_name
        type: string
      comment:
        type: string
      date:
        type: string
      diagnosis:
        type: string
      ectoItems:
        description: populated only for tp=11 records
        items:
          $ref: '#/definitions/internal_handlers.OwnerEctoItem'
        type: array
      id:
        type: string
      nextDate:
        type: string
      notes:
        type: string
      preparat:
        description: tp=1 — vaccine brand. tp=12 — dewormer drug.
        type: string
      prescription:
        description: dani column — prescription / დანიშნულება. Shown on every category.
        type: string
      procedureName:
        type: string
      procedureType:
        type: string
      serial:
        description: tp=1 — batch / serial number
        type: string
      testResults:
        description: populated only for tp=2/22/222 records
        items:
          $ref: '#/definitions/internal_handlers.OwnerTestResult'
        type: array
      treatment:
        description: tp=10x/20x — treatment / medications administered
        type: string
      vaccinations:
        items:
          type: string
        type: array
      vaccineType:
        description: tp=1 — vaccine type ("კომპლექსური ვაქცინა")
        type: string
      vetFullName:
        description: resolved "First Last" via JOIN
        type: string
      vetName:
        description: raw column value (id or free-text)
        type: string
    required:
    - comment
    - diagnosis
    - id
    - notes
    - procedureName
    - procedureType
    - vaccinations
    - vetName
    type: object
  internal_handlers.OwnerTestResult:
    properties:
      label:
        description: human-readable test name (Georgian)
        type: string
      result:
        description: typically "დადებითი" / "უარყოფითი" but can be free text
        type: string
    required:
    - label
    - result
    type: object
  internal_handlers.OwnerVisit:
    properties:
      date:
        type: string
      id:
        type: integer
      operation:
        type: string
      petId:
        description: |-
          PetID / PetName identify which animal the visit is for — an owner
          with several pets cannot otherwise tell them apart.
        type: string
      petName:
        type: string
      status:
        type: string
      time:
        type: string
      upcoming:
        description: |-
          Upcoming is true when the visit is today or later, so the client
          doesn't have to re-implement date comparison against the server's
          notion of "today".
        type: boolean
      vetFullName:
        description: |-
          VetFullName is the resolved human name, empty when the
          appointment has no vet assigned yet.
        type: string
      vetName:
        description: |-
          VetName is the raw `vetname` value (a member ID). Kept for
          backwards compatibility; clients should display VetFullName.
        type: string
    required:
    - date
    - id
    - operation
    - status
    - time
    - vetName
    type: object
  internal_handlers.OwnerWithPets:
    properties:
      email:
        type: string
      name:
        type: string
      personalId:
        type: string
      petCount:
        type: integer
      pets:
        items:
          $ref: '#/definitions/internal_handlers.PetListItem'
        type: array
      phone:
        type: string
    required:
    - email
    - name
    - personalId
    - petCount
    - pets
    - phone
    type: object
  internal_handlers.PackageResponse:
    properties:
      duration:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: string
    required:
    - duration
    - id
    - name
    - price
    type: object
  internal_handlers.PaginatedResponse:
    properties:
      data: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    required:
    - data
    - page
    - pageSize
    - total
    - totalPages
    type: object
  internal_handlers.PasswordResetRequest:
    properties:
      new_password:
        minLength: 1
        type: string
      otp_code:
        type: string
      otp_id:
        type: integer
    required:
    - new_password
    - otp_code
    - otp_id
    type: object
  internal_handlers.PaymentResponse:
    properties:
      amount:
        type: string
      date:
        type: string
      id:
        type: integer
      method:
        type: string
      uuid:
        type: string
    required:
    - amount
    - date
    - id
    - method
    - uuid
    type: object
  internal_handlers.PaymentTier:
    properties:
      count:
        type: integer
      price:
        type: string
    required:
    - count
    - price
    type: object
  internal_handlers.PetDetail:
    properties:
      birth:
        type: string
      birth2:
        type: string
      breed:
        type: string
      cast:
        type: string
      castDate:
        type: string
      castrated:
        type: boolean
      chip:
        type: string
      chipDate:
        type: string
      code:
        type: string
      color:
        type: string
      date:
        type: string
      id:
        type: string
      medicalRecords:
        items:
          $ref: '#/definitions/internal_handlers.MedicalRecord'
