        description: Owner name (denormalized)
        type: string
      id:
        type: integer
      name:
        description: Pet name
        type: string
      pet:
        description: 'Species: ძაღლი, კატა, სხვა'
        type: string
      petStatus:
        description: INHABITANT, ADOPTED, WORKMATE
        type: string
      phone:
        description: Owner phone (denormalized)
        type: string
      sex:
        type: string
      status:
        description: 1=active, 2+=inactive
        type: integer
      uuid:
        description: Owner personal ID (FK to user.last_name)
        type: string
      variety:
        description: Breed
        type: string
      vet:
        description: Clinic zip code
        type: string
    type: object
  vetapp-backend_internal_models.Procedure:
    properties:
      address:
        description: |-
          Denormalized identity / housekeeping columns the legacy table also
          stores. Mostly redundant with Pet but the PHP forms set them on
          every save and some queries depend on them.
        type: string
      anam:
        description: Anamnesis
        type: string
      coment:
        description: Comment visible to owner
        type: string
      company:
        description: payment method label e.g. "ბარათი", "ნაღდი"
        type: string
      dani:
        description: Prescription
        type: string
      date:
        description: Procedure date
        type: string
      date2:
        description: Next due date
        type: string
      date3:
        description: date2 in JS-month encoding for the PHP calendar; see handlers.legacyDate3
        type: string
      deh:
        description: Dehel drug-from-list (tp=12) OR Canine Babesia result (tp=2)
        type: string
      diagn:
        description: Diagnosis
        type: string
      id:
        type: integer
      koment:
        description: Vet-internal notes
        type: string
      name:
        description: edit-log message column (NOT the pet name — that's PName)
        type: string
      nout:
        description: Treatment
        type: string
      owner:
        description: Owner personal ID
        type: string
      ownern:
        description: Owner name (denormalized)
        type: string
      pet:
        description: pet species denormalized (ძაღლი / კატა / სხვა)
        type: string
      phone:
        description: 'Payment status: "0"=unpaid, "1"=paid'
        type: string
      pn:
        description: owner personal-id copy
        type: string
      pname:
        description: Pet name (denormalized)
        type: string
      price:
        description: Price in GEL
        type: string
      sax:
        description: pet sex denormalized
        type: string
      ser:
        description: Vaccine serial / batch number
        type: string
      sk:
        description: Clinic zip
        type: string
      test1:
        description: |-
          Extra test-result columns specific to dog tests (tp=2). PHP form
          at vet/addtest.php uses these for the Caniv 4DX panel + CDV/CAV
          test slots. Other tps leave them empty.
        type: string
      test2:
        type: string
      test3:
        type: string
      test4:
        type: string
      test5:
        type: string
      test6:
        type: string
      test7:
        type: string
      test8:
        type: string
      tp:
        description: Procedure type code
        type: integer
      tpname:
        description: Procedure type display name
        type: string
      uuid:
        description: Pet ID (as string)
        type: string
      vac:
        description: Vaccine/procedure name OR tp=11 drops-custom OR tp=12 custom
          drug
        type: string
      vac1:
        description: |-
          Polymorphic content slots. For tp=11 (ecto): drops/pills/collar/
          spray with custom-text in Vac/Vac2/Vac4/Vac6 and dropdown choice
          in Vac1/Vac3/Vac5/Vac7. For tp=2/22/222: test panel results. For
          tp=10x/20x (generic): Vac1=anamnesis, Vac2=diagnosis, Vac3=treatment.
          Vac8/Vac9 are unused in production data (empty in all rows we've
          inspected) but kept here for legacy compatibility.
        type: string
      vac2:
        type: string
      vac3:
        type: string
      vac4:
        type: string
      vac5:
        type: string
      vac6:
        type: string
      vac7:
        type: string
      vac8:
        type: string
      vac9:
        type: string
      vacn:
        description: Brand OR tp=2 Leishmania result
        type: string
      vetname:
        description: Vet member ID (numeric string) — empty/0 means owner-added
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Veterinary clinic management API
  title: VetApp API
  version: "1.0"
paths:
  /admin/members:
    get:
      parameters:
      - description: 1 owner (default), 2 vet, 3 department, 4 admin
        in: query
        name: group
        type: integer
      - description: Name, personal ID, email or phone
        in: query
        name: search
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: List accounts (admin)
      tags:
      - admin
  /admin/members/{id}:
    delete:
      parameters:
      - description: Member ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable an account (admin)
      tags:
      - admin
  /admin/transactions:
    get:
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Subscription payment log (admin)
      tags:
      - admin
  /allergies:
    get:
      parameters:
      - description: Pet ID
        in: query
        name: pet_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.AllergyResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List allergies
      tags:
      - allergies
    post:
      consumes:
      - application/json
      parameters:
      - description: Allergy data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateAllergyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers.AllergyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add allergy
      tags:
      - allergies
  /allergies/{id}:
    delete:
      parameters:
      - description: Allergy ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete allergy
      tags:
      - allergies
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.ChangePasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/email/verify/confirm:
    get:
      parameters:
      - description: Verification token from the email link
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML success page
          schema:
            type: string
        "400":
          description: HTML error page
          schema:
            type: string
      summary: Confirm email verification
      tags:
      - auth
  /auth/email/verify/send:
    post:
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_handlers.EmailVerifySendResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "409":
          description: email already verified
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send email verification
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - auth
  /auth/otp/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: Phone and type
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.OTPSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.OTPSendResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: Send OTP
      tags:
      - auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: OTP ID and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.OTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.OTPVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: Verify OTP
      tags:
      - auth
  /auth/password-reset:
    post:
      consumes:
      - application/json
      parameters:
      - description: OTP and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.PasswordResetRequest'
      produces:
      - application/json
      responses:
